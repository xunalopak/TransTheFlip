name: Build & Release FAP

# Déclenché sur tout push d'un tag vX.Y.Z
on:
  push:
    tags:
      - 'v*'

# Droits nécessaires pour créer la release et uploader les assets
permissions:
  contents: write

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # Job 1 : compilation du FAP Flipper (Linux + ufbt)
  # ════════════════════════════════════════════════════════════════════════
  build-fap:
    name: Build DuckerTheFlipper.fap
    runs-on: ubuntu-latest

    steps:
      # ── 1. Récupérer le code ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python pour ufbt ──────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Cache du SDK Unleashed (évite de le re-télécharger à chaque run) ─
      - name: Cache ufbt SDK
        uses: actions/cache@v4
        with:
          path: ~/.ufbt
          key: ufbt-sdk-unleashed-release-${{ runner.os }}
          restore-keys: |
            ufbt-sdk-unleashed-release-

      # ── 4. Installer ufbt ────────────────────────────────────────────────
      - name: Install ufbt
        run: pip install ufbt

      # ── 5. Télécharger / mettre à jour le SDK Unleashed ──────────────────
      - name: Update Unleashed SDK
        run: ufbt update --channel=release

      # ── 6. Compiler le FAP ───────────────────────────────────────────────
      - name: Build FAP
        run: ufbt build

      - name: Test transfer protocol and HID sender
        run: |
          gcc -std=c11 -Wall -Wextra -Werror tests/test_protocol.c -o /tmp/test_protocol
          /tmp/test_protocol
          gcc -std=c11 -Wall -Wextra -Werror -Itests/stubs tests/test_hid.c trans_the_flip_hid.c -o /tmp/test_hid
          /tmp/test_hid

      # ── 7. Copier avec le nom incluant la version du tag ─────────────────
      - name: Rename FAP with version
        run: |
          FAP=$(find ~/.ufbt/build -name "trans_the_flip.fap" | head -1)
          echo "FAP source: $FAP"
          cp "$FAP" "DuckerTheFlipper-${{ github.ref_name }}.fap"

      # ── 8. Publier le FAP comme artefact pour le job de release ───────────
      - name: Upload FAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: fap
          path: DuckerTheFlipper-${{ github.ref_name }}.fap

  # ════════════════════════════════════════════════════════════════════════
  # Job 2 : compilation des clients PC en exécutables Windows (PyInstaller)
  # ════════════════════════════════════════════════════════════════════════
  build-clients:
    name: Build Windows clients (.exe)
    runs-on: windows-latest

    steps:
      # ── 1. Récupérer le code ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Dépendances clients + PyInstaller ─────────────────────────────
      - name: Install dependencies
        working-directory: pc_client
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # ── 4. GUI : DuckerTheFlipper-GUI.exe (fenêtré, embarque customtkinter) ──
      - name: Test PC client
        run: |
          python -m unittest discover -s pc_client
          python tests/check_gui.py

      # ── 5. CLI : DuckerTheFlipper-CLI.exe (console) ──────────────────────────
      - name: Build Windows executables
        run: ./pc_client/build_windows.ps1

      # ── 6. Publier les exes comme artefacts pour le job de release ───────
      - name: Upload client artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clients
          path: dist/*.exe

  # ════════════════════════════════════════════════════════════════════════
  # Job 3 : création de la release GitHub avec tous les assets
  # ════════════════════════════════════════════════════════════════════════
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-fap, build-clients]

    steps:
      # ── 1. Récupérer tous les artefacts (FAP + exes) ─────────────────────
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # ── 2. Créer la release et attacher tous les fichiers ────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DuckerTheFlipper ${{ github.ref_name }} — New name, same features
          files: |
            artifacts/DuckerTheFlipper-${{ github.ref_name }}.fap
            artifacts/DuckerTheFlipper-GUI.exe
            artifacts/DuckerTheFlipper-CLI.exe
          generate_release_notes: true
          body: |
            ## DuckerTheFlipper

            Previously named TransTheFlip. The TTF1 protocol, internal FAP identifier
            and saved settings remain unchanged for compatibility.

            ## What's new in v2.3.1

            - TransTheFlip is now DuckerTheFlipper, including the repository,
              desktop interface, CLI banner and Flipper app display name.
            - Windows downloads are now DuckerTheFlipper-GUI.exe and DuckerTheFlipper-CLI.exe;
              the Flipper release asset is DuckerTheFlipper-${{ github.ref_name }}.fap.
            - Updated README with privacy-safe desktop and activity-log screenshots.
            - Existing protocol, saved-device settings and Flipper storage paths are preserved.
              This is a branding/documentation update, not a protocol change.

            ## Included since v2.3.0

            - Refreshed desktop GUI: dark theme, orange accents, clearer sections,
              resizable text editor, prominent Send/Execute buttons and collapsible activity log.
            - Custom duck-and-dolphin logo in the GUI, window and Windows executable icon.
            - French/English GUI language selector; English CLI and documentation.
            - Select the Flipper keyboard layout from the connected GUI: built-in QWERTY US,
              or fr-FR.kl, de-DE.kl and en-US.kl from the Flipper SD card.
            - Keyboard changes are confirmed by the Flipper and blocked during a pending transfer.
              Missing layout files preserve the previous selection.
            - Fixed the Bluetooth handshake to deliver protocol and layout information together.

            ## Included transfer features

            - Up to 65,536 ASCII bytes per transfer, including tags, tabs and line breaks.
              Text over 4,096 bytes uses a temporary file on the Flipper SD card.
            - Length and CRC32 verification before execution. Sending and execution remain
              separate actions; use Execute on Flipper or the physical OK button to start typing.
            - Transfer/typing progress, session-only history, remembered device, Bluetooth
              diagnostics and a Disconnect button. Text is retained after an error.
            - Separate Bluetooth/USB status, scrollable preview, adjustable typing delay and
              cancellation using Back on the Flipper.

            ## Installation

            Update both the PC client and Flipper FAP for remote keyboard selection.
            Run DuckerTheFlipper-GUI.exe or DuckerTheFlipper-CLI.exe on Windows (Python is not required).
            Install the FAP on your Flipper, open DuckerTheFlipper and connect from the PC.
            External .kl layouts must exist in /ext/badusb/assets/layouts and match the target OS.

            ## Verification

            Python and C checks cover Bluetooth lifecycle, framing/CRC, transfer exclusion,
            keyboard commands, HID cancellation and USB failures. Real Tk checks cover both
            languages, small windows and the activity log. Hardware BLE layout/restore,
            missing-file and busy-state checks passed without executing USB keystrokes.
            Physical typing and macOS behavior still require verification on your target machine.
          fail_on_unmatched_files: true
